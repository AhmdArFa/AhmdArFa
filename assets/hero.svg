<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Ahmed Gamal Arfa - Data and AI Engineer, Full-Stack Architect">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="50%" stop-color="#0D1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="sparklineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, Monaco, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .glow { filter: url(#glowCyan); }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="460" fill="url(#bgGrad)"/>
  <rect width="1200" height="460" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="120" r="140" fill="#00D4FF" fill-opacity="0.08" filter="blur(40px)"/>
  <circle cx="980" cy="240" r="180" fill="#3B82F6" fill-opacity="0.09" filter="blur(50px)"/>
  <circle cx="600" cy="400" r="120" fill="#10B981" fill-opacity="0.05" filter="blur(40px)"/>

  <!-- Left Side: Narrative & Identity -->
  <g transform="translate(60, 55)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="340" height="30" rx="15" fill="#0F172A" stroke="#00D4FF" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="16" cy="15" r="4.5" fill="#10B981" class="glow"/>
    <text x="30" y="20" fill="#94A3B8" font-size="12" font-weight="600" class="mono" letter-spacing="1.2">SYSTEM: ONLINE · CAIRO, EGYPT</text>

    <!-- Name Heading -->
    <text x="0" y="85" fill="#FFFFFF" font-size="44" font-weight="800" class="sans" letter-spacing="-0.5">Ahmed Gamal Arfa</text>
    
    <!-- Title Line with Gradient -->
    <text x="0" y="122" fill="url(#accentCyan)" font-size="20" font-weight="700" class="sans" letter-spacing="0.5">
      DATA &amp; AI ENGINEER · FULL-STACK ARCHITECT
    </text>

    <!-- Short Narrative -->
    <text x="0" y="165" fill="#94A3B8" font-size="15" class="sans" line-height="24">
      <tspan x="0" dy="0">Core engineering contributor to the MCIT DEPI applicant verification platform.</tspan>
      <tspan x="0" dy="24">Designing resilient data architectures, computer vision pipelines &amp; production APIs.</tspan>
    </text>

    <!-- Tech Disciplines Pills -->
    <g transform="translate(0, 225)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="67" y="20" fill="#38BDF8" font-size="12" font-weight="600" class="mono" text-anchor="middle">Power BI / Fabric</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="130" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="210" y="20" fill="#F472B6" font-size="12" font-weight="600" class="mono" text-anchor="middle">PyTorch · YOLO</text>

      <!-- Pill 3 -->
      <rect x="285" y="0" width="115" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="342" y="20" fill="#34D399" font-size="12" font-weight="600" class="mono" text-anchor="middle">FastAPI · REST</text>

      <!-- Pill 4 -->
      <rect x="410" y="0" width="115" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="467" y="20" fill="#A78BFA" font-size="12" font-weight="600" class="mono" text-anchor="middle">LLMs &amp; RAG</text>
    </g>

    <!-- Certification Badges -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="525" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="18" y="26" fill="#E2E8F0" font-size="13" font-weight="600" class="sans">
        🏅 Microsoft Fabric &amp; Power BI Certified · 📜 Google Data Analytics Specialization
      </text>
    </g>
  </g>

  <!-- Right Side: Object Detection / Telemetry HUD Frame -->
  <g transform="translate(720, 48)">
    <!-- Outer Card Frame -->
    <rect x="0" y="0" width="420" height="364" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Bar -->
    <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 406 0 C 413.73 0 420 6.27 420 14 L 420 40 L 0 40 Z" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <circle cx="24" cy="20" r="5" fill="#EF4444"/>
    <circle cx="42" cy="20" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="20" r="5" fill="#10B981"/>
    <text x="82" y="24" fill="#64748B" font-size="12" class="mono">telemetry.agent.arfa // live</text>

    <!-- Detection Box 1: Data Analytics -->
    <g transform="translate(25, 62)">
      <rect x="0" y="0" width="370" height="74" rx="6" fill="#0B132B" stroke="#00D4FF" stroke-width="1.2" stroke-dasharray="4,2"/>
      <rect x="0" y="0" width="170" height="20" rx="3" fill="#00D4FF"/>
      <text x="8" y="14" fill="#0B132B" font-size="11" font-weight="700" class="mono">DATA_PIPELINE: 0.99</text>
      <text x="15" y="42" fill="#E2E8F0" font-size="13" font-weight="600" class="sans">DEPI Dual-Sync &amp; Power BI Engine</text>
      <text x="15" y="60" fill="#94A3B8" font-size="11" class="mono">LATENCY: &lt;45ms · RECORDS: 48.6K+ · ETL: ACTIVE</text>
    </g>

    <!-- Detection Box 2: Computer Vision -->
    <g transform="translate(25, 150)">
      <rect x="0" y="0" width="370" height="74" rx="6" fill="#0B132B" stroke="#10B981" stroke-width="1.2" stroke-dasharray="4,2"/>
      <rect x="0" y="0" width="185" height="20" rx="3" fill="#10B981"/>
      <text x="8" y="14" fill="#052E16" font-size="11" font-weight="700" class="mono">COMPUTER_VISION: 0.98</text>
      <text x="15" y="42" fill="#E2E8F0" font-size="13" font-weight="600" class="sans">YOLOv8 + ResNet-50 Dual Stack</text>
      <text x="15" y="60" fill="#94A3B8" font-size="11" class="mono">mAP: 0.81 · F1-SCORE: 0.978 · INFERENCE: &lt;3s</text>
    </g>

    <!-- Detection Box 3: Production APIs -->
    <g transform="translate(25, 238)">
      <rect x="0" y="0" width="370" height="96" rx="6" fill="#0B132B" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="4,2"/>
      <rect x="0" y="0" width="160" height="20" rx="3" fill="#818CF8"/>
      <text x="8" y="14" fill="#1E1B4B" font-size="11" font-weight="700" class="mono">BACKEND_API: 1.00</text>
      
      <!-- Mini Sparkline Graph -->
      <path d="M 15 282 L 40 275 L 70 280 L 105 260 L 140 268 L 180 250 L 220 255 L 260 245 L 300 248 L 350 240" fill="none" stroke="url(#sparklineGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <text x="15" y="320" fill="#CBD5E1" font-size="11" font-weight="600" class="mono">UPTIME: 99.98% · RBAC AUTH · FASTAPI + REACT 19</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="0" y1="458" x2="1200" y2="458" stroke="url(#accentCyan)" stroke-width="3"/>
</svg>
